<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="22枚の大アルカナから1枚引いて、正位置・逆位置の意味を読める占いアプリ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="大アルカナ占い">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2323265a'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%23c2372a'/%3E%3Ctext x='32' y='42' font-size='28' text-anchor='middle' fill='%23f6f4fa' font-family='serif'%3E%E5%8D%A0%3C/text%3E%3C/svg%3E">
<title>大アルカナ占い</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* Layout: card (left) and reading (right) on wide screens, stacked below 900px.
   Card back is seigaiha waves with a vermilion 占 seal; card face is paper, indigo line art,
   and one vermilion accent. */
:root{
  --bg:#e8e6f0;
  --surface:#f6f5fb;
  --fg:#1d1f45;
  --muted:#585b84;
  --line:#cac8dd;
  --accent:#bd3627;
  --on-accent:#ffffff;
  --shadow:rgba(30,32,80,.32);
  /* the card itself is a physical object: same in both themes */
  --ink:#23265a;
  --paper:#f6f4fa;
  --shu:#c2372a;
  --back:#23265a;
  --back-line:#6a70b5;
  --back-frame:#e8e4f2;
  --f-display:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --f-latin:'Cormorant Garamond','Iowan Old Style',Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1026;--surface:#191b3f;--fg:#ecebf7;--muted:#a3a6cf;--line:#30336a;
    --accent:#f27a68;--on-accent:#1d0f1c;--shadow:rgba(0,0,0,.55);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1026;--surface:#191b3f;--fg:#ecebf7;--muted:#a3a6cf;--line:#30336a;
  --accent:#f27a68;--on-accent:#1d0f1c;--shadow:rgba(0,0,0,.55);color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.75;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
.app{max-width:1120px;margin:0 auto;padding-block:12px 48px;padding-inline:max(16px,3vw)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:8px 20px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:1.5rem;letter-spacing:.12em;line-height:1.3}
.sub{font-family:var(--f-latin);font-style:italic;color:var(--muted);letter-spacing:.14em;font-size:1rem}
.tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.tabs button{min-height:44px;padding:0 22px;border:0;border-radius:999px;background:transparent;color:var(--muted);font:inherit;font-size:.95rem;font-weight:500;cursor:pointer;touch-action:manipulation}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
button:focus-visible,.switch input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* stage */
.stage{display:grid;gap:32px;justify-items:center;align-items:start;padding-top:8px}
.deck{display:flex;flex-direction:column;align-items:center;gap:28px;--cw:min(264px,64vw)}
.reading{width:100%;max-width:560px;min-width:0;transition:opacity .35s}
.reading.is-hidden{opacity:0}
@media (min-width:900px){
  .stage{grid-template-columns:auto minmax(0,1fr);gap:64px;justify-items:stretch}
  .deck{--cw:min(300px,28vw,calc((100vh - 250px)*.588));--cw:min(300px,28vw,calc((100svh - 250px)*.588))}
  .reading{justify-self:start;padding-top:8px}
}

/* card object */
.card-wrap{width:var(--cw);aspect-ratio:200/340;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent;margin-right:12px;margin-bottom:12px}
.shadow{position:absolute;inset:6% 8% -3%;background:var(--shadow);filter:blur(22px);border-radius:50%}
.shake{position:absolute;inset:0;perspective:1400px;isolation:isolate}
.shake::before,.shake::after{content:"";position:absolute;inset:0;border-radius:5% / 2.9%;background:var(--back);border:1.5px solid var(--back-line);z-index:-1}
.shake::before{transform:translate(5px,6px)}
.shake::after{transform:translate(10px,12px)}
.card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.7,.2,1)}
.is-open .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face svg{display:block;width:100%;height:100%}
.front{transform:rotateY(180deg)}
.is-rev .front svg{transform:rotate(180deg)}

@keyframes riffle{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-6px,-4px) rotate(-2.5deg)}50%{transform:translate(5px,3px) rotate(2deg)}75%{transform:translate(-3px,2px) rotate(-1deg)}}
@keyframes fanL{0%,100%{transform:translate(5px,6px)}40%{transform:translate(-26px,8px) rotate(-8deg)}70%{transform:translate(-10px,6px) rotate(-3deg)}}
@keyframes fanR{0%,100%{transform:translate(10px,12px)}40%{transform:translate(34px,14px) rotate(9deg)}70%{transform:translate(18px,12px) rotate(4deg)}}
.shuffling .shake{animation:riffle .5s ease-in-out 2}
.shuffling .shake::before{animation:fanL .5s ease-in-out 2}
.shuffling .shake::after{animation:fanR .5s ease-in-out 2}
@media (prefers-reduced-motion:reduce){
  .card-inner{transition-duration:.01s}
  .shuffling .shake,.shuffling .shake::before,.shuffling .shake::after{animation:none}
  .reading{transition:none}
}

/* card art (inside the svg) */
.ln{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.th{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.ls{fill:none;stroke:var(--shu);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bolt{fill:none;stroke:var(--shu);stroke-width:3.4;stroke-linejoin:miter}
.fk{fill:var(--ink)}
.fs{fill:var(--shu)}
.fpaper{fill:var(--paper)}
.fp{fill:var(--paper);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.cf-edge{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}
.cf-in{fill:none;stroke:var(--ink);stroke-width:.7}
.roman{font-family:var(--f-latin);fill:var(--ink);font-weight:600;letter-spacing:2px}
.div{stroke:var(--ink);stroke-width:.8;fill:none}
.jpname{font-family:var(--f-display);font-weight:700;fill:var(--ink);letter-spacing:3px}
.enname{font-family:var(--f-latin);fill:var(--ink);letter-spacing:2.5px;font-weight:600}
.bk-edge{fill:var(--back);stroke:var(--back-frame);stroke-width:1.2}
.bk-fill{fill:var(--back)}
.bk-wave{fill:none;stroke:var(--back-line);stroke-width:.9}
.bk-frame{fill:none;stroke:var(--back-frame);stroke-width:1}
.bk-frame2{fill:none;stroke:var(--back-line);stroke-width:.8}
.bk-seal{fill:var(--shu)}
.bk-ring{fill:none;stroke:var(--paper);stroke-width:.9}
.bk-kan{fill:var(--paper);font-family:var(--f-display);font-weight:700}

/* controls */
.actions{display:flex;flex-direction:column;align-items:center;gap:14px}
.btn{min-height:54px;padding:0 36px;border-radius:999px;border:1.5px solid transparent;font:inherit;font-size:1.05rem;font-weight:700;letter-spacing:.1em;cursor:pointer;touch-action:manipulation}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.55;cursor:default}
.switch{display:inline-flex;align-items:center;gap:12px;min-height:44px;color:var(--muted);font-size:.95rem;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;margin:0;transition:background .2s;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px var(--shadow);transition:transform .2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(18px)}

/* reading */
.eyebrow{margin:0 0 6px;font-family:var(--f-latin);font-style:italic;letter-spacing:.14em;color:var(--muted);font-size:1.05rem}
.reading h2,.sheet h2{margin:0;font-family:var(--f-display);font-weight:700;line-height:1.3;text-wrap:balance}
.intro-title{font-size:1.9rem;letter-spacing:.06em}
:where(.reading,.sheet-text) p{margin:0}
.reading .intro-body{margin-top:16px}
.cn-jp{display:block;font-size:2.2rem;letter-spacing:.08em}
.cn-en{display:block;font-family:var(--f-latin);font-style:italic;font-weight:500;font-size:1.25rem;color:var(--muted);letter-spacing:.06em;margin-top:2px}
.pos{display:inline-flex;align-items:center;gap:8px;margin:0 0 12px;padding:3px 16px;border:1.5px solid var(--fg);border-radius:999px;font-size:.9rem;font-weight:700;letter-spacing:.16em}
.pos.is-rev{border-color:var(--accent);color:var(--accent)}
.kw{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0;padding:0;list-style:none}
.kw li{padding:1px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:.92rem}
.hl{margin-top:16px;font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1.55;text-wrap:balance}
.mean{margin-top:14px;font-size:1rem;line-height:1.9;color:var(--muted)}
.scene{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.scene h3,.sheet h3{margin:0 0 4px;font-size:.8rem;letter-spacing:.2em;color:var(--muted);font-weight:700}
.scene p{color:var(--muted);font-size:.95rem}
details.other{margin-top:18px;border:1px solid var(--line);border-radius:10px;padding:0 16px;background:var(--surface)}
details.other summary{min-height:50px;display:flex;align-items:center;cursor:pointer;font-size:.95rem;letter-spacing:.06em}
details.other p{margin-top:0;padding-bottom:14px;font-size:.98rem}
details.other .hl2{font-weight:700;padding-bottom:6px}
details.other+details.other{margin-top:10px}
.sheet .hl{font-size:1.2rem;margin-top:8px}

/* index */
.lead{margin:0 0 8px;color:var(--muted)}
.grid{list-style:none;margin:0;padding:12px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:30px 20px}
.tile{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer;text-align:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tile .mini{display:block;width:100%;max-width:168px;aspect-ratio:200/340;filter:drop-shadow(0 6px 10px var(--shadow));transition:transform .2s}
.tile .mini svg{display:block;width:100%;height:100%}
.tile:active .mini{transform:scale(.97)}
.tile .t-kw{font-size:.82rem;color:var(--muted);line-height:1.5}

/* detail sheet */
.sheet{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(12,13,36,.6);overflow:auto;overscroll-behavior:contain}
.sheet-body{position:relative;width:min(780px,100%);max-height:100%;overflow:auto;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:18px;padding:28px;display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr);gap:28px;align-items:start}
.sheet-card{width:100%;aspect-ratio:200/340;filter:drop-shadow(0 8px 14px var(--shadow))}
.sheet-card svg{display:block;width:100%;height:100%}
.sheet-text{min-width:0;padding-right:40px}
.two{display:grid;gap:16px;margin-top:18px}
.two section{padding-top:14px;border-top:1px solid var(--line)}
.two h3.r{color:var(--accent)}
.two .kw{margin-top:8px}
.two .m{margin-top:10px}
.close{position:absolute;top:10px;right:10px;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:1.5rem;line-height:1;cursor:pointer;touch-action:manipulation}
@media (max-width:640px){
  .sheet-body{grid-template-columns:minmax(0,1fr);justify-items:center;padding:24px 20px}
  .sheet-card{width:min(210px,58vw)}
  .sheet-text{padding-right:0;width:100%}
}
.foot{margin:44px 0 0;color:var(--muted);font-size:.8rem;text-align:center}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>大アルカナ占い</h1><span class="sub">Major Arcana</span></div>
    <nav class="tabs" aria-label="表示の切り替え">
      <button type="button" id="tabDraw" aria-pressed="true">引く</button>
      <button type="button" id="tabIndex" aria-pressed="false">カード一覧</button>
    </nav>
  </header>

  <main>
    <section id="viewDraw" aria-label="カードを引く">
      <div class="stage">
        <div class="deck">
          <div class="card-wrap" id="card" aria-hidden="true">
            <div class="shadow"></div>
            <div class="shake">
              <div class="card-inner">
                <div class="face back" id="backFace"></div>
                <div class="face front" id="frontFace"></div>
              </div>
            </div>
          </div>
          <div class="actions">
            <button type="button" class="btn primary" id="drawBtn">カードを引く</button>
            <label class="switch"><input type="checkbox" id="revToggle" checked><span>逆位置も使う</span></label>
          </div>
        </div>
        <div class="reading" id="reading" aria-live="polite">
          <p class="eyebrow">はじめに</p>
          <h2 class="intro-title">今日の一枚を引く</h2>
          <p class="intro-body">知りたいことを一つ思い浮かべて、カードにふれてください。「今日をどう過ごすか」のような漠然とした問いでも大丈夫です。</p>
          <div class="scene">
            <h3>大アルカナとは</h3>
            <p>22枚の絵札です。0の愚者から21の世界まで、一人の旅人が歩む道のりを順に描いたものとして読まれます。</p>
          </div>
        </div>
      </div>
    </section>

    <section id="viewIndex" aria-label="カード一覧" hidden>
      <p class="lead">22枚すべてのカードです。タップすると正位置と逆位置の意味を読めます。</p>
      <ul class="grid" id="grid"></ul>
    </section>
  </main>

  <p class="foot">占いは気軽な楽しみとしてお使いください。結果は一つの見方にすぎません。</p>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-body">
    <button type="button" class="close" id="sheetClose" aria-label="閉じる">×</button>
    <div class="sheet-card" id="sheetCard"></div>
    <div class="sheet-text" id="sheetText"></div>
  </div>
</div>

<script>
/*DATA-START*/
const f=v=>Math.round(v*10)/10;
const pt=(cx,cy,r,a)=>[f(cx+r*Math.cos(a)),f(cy+r*Math.sin(a))];
const P=(cx,cy,r,a)=>pt(cx,cy,r,a).join(" ");
const rays=(cx,cy,r1,r2,n,off=0)=>{let d="";for(let i=0;i<n;i++){const a=off+i*2*Math.PI/n;d+="M"+P(cx,cy,r1,a)+"L"+P(cx,cy,r2,a)}return d};
const fan=(cx,cy,r1,r2,n,a0,a1)=>{let d="";for(let i=0;i<n;i++){const a=a0+i*(a1-a0)/(n-1);d+="M"+P(cx,cy,r1,a)+"L"+P(cx,cy,r2,a)}return d};
const starPath=(cx,cy,ro,ri,n,rot=-Math.PI/2)=>{let d="";for(let i=0;i<n*2;i++){const r=i%2?ri:ro,a=rot+i*Math.PI/n;d+=(i?"L":"M")+P(cx,cy,r,a)}return d+"Z"};
const tri=(cx,cy,r,rot)=>{let d="";for(let i=0;i<3;i++){d+=(i?"L":"M")+P(cx,cy,r,rot+i*2*Math.PI/3)}return d+"Z"};
const hexa=(cx,cy,r)=>tri(cx,cy,r,-Math.PI/2)+tri(cx,cy,r,Math.PI/2);
const penta=(cx,cy,r)=>"M"+[0,2,4,1,3,0].map(k=>P(cx,cy,r,Math.PI/2+k*2*Math.PI/5)).join("L")+"Z";
const infPath=(cx,cy,w,h)=>`M${cx} ${cy}C${f(cx-w*.2)} ${f(cy-h)} ${f(cx-w/2)} ${f(cy-h)} ${f(cx-w/2)} ${cy}C${f(cx-w/2)} ${f(cy+h)} ${f(cx-w*.2)} ${f(cy+h)} ${cx} ${cy}C${f(cx+w*.2)} ${f(cy-h)} ${f(cx+w/2)} ${f(cy-h)} ${f(cx+w/2)} ${cy}C${f(cx+w/2)} ${f(cy+h)} ${f(cx+w*.2)} ${f(cy+h)} ${cx} ${cy}Z`;
const ellTicks=(cx,cy,rx,ry,n,len=9)=>{let d="";for(let i=0;i<n;i++){const a=i*2*Math.PI/n,c=Math.cos(a),s=Math.sin(a);d+=`M${f(cx+rx*c)} ${f(cy+ry*s)}L${f(cx+(rx+len)*c)} ${f(cy+(ry+len)*s)}`}return d};
const dotRing=(cx,cy,rad,n,a0,a1,r,cls)=>{let s="";for(let i=0;i<n;i++){const [x,y]=pt(cx,cy,rad,a0+i*(a1-a0)/(n-1));s+=`<circle class="${cls}" cx="${x}" cy="${y}" r="${r}"/>`}return s};
const smallStars=pts=>pts.map(([x,y])=>`<path class="fk" d="${starPath(x,y,5.5,1.8,4)}"/>`).join("");
const riser=x=>`<circle class="ln" cx="${x}" cy="116" r="3.5"/><path class="ln" d="M${x-9} 110L${x} 126L${x+9} 110M${x} 126V142"/>`;
const corners=`<circle class="ln" cx="12" cy="12" r="6"/><path class="ln" d="M138 5L145 18H131Z"/><path class="ln" d="M6 132H18V144H6Z"/><circle class="ln" cx="138" cy="138" r="4.5"/><path class="th" d="${rays(138,138,7,10.5,8)}"/>`;
const cup=`<path class="ln" d="M18 36H46Q44 56 32 58Q20 56 18 36ZM32 58V70M24 70H40"/>`;

const ART=[
/* 0 愚者 */
`<circle class="fs" cx="108" cy="30" r="17"/><path class="th" d="${rays(108,30,22,29,12)}"/>
<path class="ln" d="M0 118H76V150"/><path class="th" d="M10 130L20 150M28 130L38 150M46 130L56 150M64 132L70 150"/>
<circle class="ln" cx="74" cy="64" r="7"/><path class="ln" d="M74 72V98L66 117M74 98L88 108M74 80L96 70M74 80L57 68"/><circle class="fk" cx="52" cy="66" r="5"/>`,
/* 1 魔術師 */
`<path class="ls" d="${infPath(75,14,50,9)}"/><circle class="ln" cx="75" cy="38" r="8"/>
<path class="ln" d="M75 48L58 108H92Z"/><path class="ln" d="M90 72L110 36M60 74L44 94"/><circle class="fs" cx="112" cy="32" r="3.5"/>
<path class="ln" d="M20 108H130M30 108V142M120 108V142"/>
<circle class="ln" cx="30" cy="102" r="4.5"/>
<path class="ln" d="M42 92H54Q54 102 48 102Q42 102 42 92ZM48 102V106M44 106H52"/>
<path class="ln" d="M102 106V86M97 94H107M120 106V88"/>`,
/* 2 女教皇 */
`<rect class="fk" x="8" y="6" width="22" height="140"/><rect class="fp" x="120" y="6" width="22" height="140"/>
<circle class="fs" cx="75" cy="20" r="11"/><circle class="fpaper" cx="81" cy="17" r="9"/>
<circle class="ln" cx="75" cy="48" r="8"/><path class="ln" d="M75 57L50 146H100Z"/>
<rect class="fp" x="64" y="88" width="22" height="15" rx="1"/><path class="th" d="M68 93H82M68 98H78"/>`,
/* 3 女帝 */
`<circle class="ln" cx="75" cy="56" r="26"/><circle class="fs" cx="75" cy="56" r="9"/>
<path class="ln" d="M75 82V140M54 112H96"/>${dotRing(75,56,38,5,-2.79,-.35,2.6,"fs")}
<path class="th" d="M16 142Q14 112 28 94M134 142Q136 112 122 94"/>`,
/* 4 皇帝 */
`<rect class="ln" x="40" y="40" width="70" height="100"/>
<path class="ln" d="M40 46C24 48 22 24 38 22C48 22 48 34 41 36M110 46C126 48 128 24 112 22C102 22 102 34 109 36"/>
<path class="fp" d="M58 68H92L98 130H52Z"/><circle class="fp" cx="75" cy="56" r="9"/>
<path class="ln" d="M66 46L68 36L72 42L75 34L78 42L82 36L84 46"/>

 rev:"明るさが少し曇っています。楽観しすぎず、成果が出るまでにもう少し時間がかかるかもしれません。",
 scene:"大きな太陽の下、白馬に乗って旗を掲げる子ども。背景にはひまわりが並んでいる。"},
{jp:"審判",hl:"呼びかけに応えて、決断するとき",hr:"完璧を求めず、今の自分で決めよう",en:"Judgement",ku:["復活","再起","覚悟","決断"],kr:["後悔","決断できない","自己否定","見送り"],
 up:"過去の経験が実り、もう一度立ち上がる時です。呼びかけに応えて、迷っていたことを決断しましょう。",
 rev:"過去への後悔や自己否定で、一歩が出せずにいます。完璧を求めず、今の自分で決めてよいのです。",
 scene:"天使のラッパを合図に、棺から人々が両手を広げて起き上がる。"},
{jp:"世界",hl:"ひとつの完成。次のステージへ",hr:"あと一歩。最後の詰めをしよう",en:"The World",ku:["完成","達成","統合","満たされる"],kr:["未完","あと一歩","停滞","燃え尽き"],
 up:"一つのサイクルが完成し、満たされる時です。努力が実り、次のステージへ進む準備が整います。",
 rev:"あと一歩のところで、仕上がりきっていません。細部の詰めや、終わらせる決断をしてみましょう。",
 scene:"月桂樹の輪の中で踊る人物。四隅には四つの生き物が囲んでいる。"}
];
CARDS.forEach((c,i)=>{c.i=i});

function cardSVG(i){
  const c=CARDS[i],n=c.jp.length,fs=n<=3?26:n===4?24:20;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 340" role="img" aria-label="${c.jp}、${c.en}">
<rect class="cf-edge" x="4" y="4" width="192" height="332" rx="10"/><rect class="cf-in" x="12" y="12" width="176" height="316" rx="4"/>
<text class="roman" x="100" y="42" font-size="19" text-anchor="middle">${ROMAN[i]}</text>
<g transform="translate(100 151) scale(1.1) translate(-75 -75)">${ART[i]}</g>
<path class="div" d="M44 262H156"/>
<text class="jpname" x="100" y="292" font-size="${fs}" text-anchor="middle">${c.jp}</text>
<text class="enname" x="100" y="314" font-size="12" text-anchor="middle">${c.en.toUpperCase()}</text></svg>`;
}
const BACK=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 340" aria-hidden="true">
<defs><pattern id="sgh" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" class="bk-fill"/>
<path class="bk-wave" d="M0 12A12 12 0 0 1 24 12M4 12A8 8 0 0 1 20 12M8 12A4 4 0 0 1 16 12M-12 24A12 12 0 0 1 12 24M-8 24A8 8 0 0 1 8 24M-4 24A4 4 0 0 1 4 24M12 24A12 12 0 0 1 36 24M16 24A8 8 0 0 1 32 24M20 24A4 4 0 0 1 28 24"/></pattern></defs>
<rect class="bk-edge" x="4" y="4" width="192" height="332" rx="10"/>
<rect x="16" y="16" width="168" height="308" rx="3" fill="url(#sgh)"/><rect class="bk-frame" x="16" y="16" width="168" height="308" rx="3"/>
<rect class="bk-frame2" x="10" y="10" width="180" height="320" rx="6"/>
<circle class="bk-seal" cx="100" cy="170" r="36"/><circle class="bk-ring" cx="100" cy="170" r="30"/>
<text class="bk-kan" x="100" y="184" font-size="38" text-anchor="middle">占</text></svg>`;

function readingHTML(c,rev){
  const kws=rev?c.kr:c.ku;
  return `<p class="pos ${rev?"is-rev":""}"><span aria-hidden="true">${rev?"▽":"△"}</span>${rev?"逆位置":"正位置"}</p>
<h2><span class="cn-jp">${c.jp}</span><span class="cn-en">${ROMAN[c.i]} ・ ${c.en}</span></h2>
<p class="hl">${rev?c.hr:c.hl}</p>
<ul class="kw">${kws.map(k=>`<li>${k}</li>`).join("")}</ul>
<p class="mean">${rev?c.rev:c.up}</p>
<details class="other"><summary>${rev?"正位置":"逆位置"}のときの意味</summary><p class="hl2">${rev?c.hl:c.hr}</p><p>${rev?c.up:c.rev}</p></details>
<details class="other"><summary>絵柄の見かた</summary><p>${c.scene}</p></details>`;
}
function detailHTML(c){
  const li=a=>`<ul class="kw">${a.map(k=>`<li>${k}</li>`).join("")}</ul>`;
  return `<p class="eyebrow">No. ${ROMAN[c.i]}</p>
<h2 id="sheetTitle"><span class="cn-jp">${c.jp}</span><span class="cn-en">${c.en}</span></h2>
<div class="two"><section><h3>正位置</h3><p class="hl">${c.hl}</p>${li(c.ku)}<p class="m">${c.up}</p></section>
<section><h3 class="r">逆位置</h3><p class="hl">${c.hr}</p>${li(c.kr)}<p class="m">${c.rev}</p></section></div>
<div class="scene"><h3>絵柄</h3><p>${c.scene}</p></div>`;
}
/*DATA-END*/

(function(){
  const $=s=>document.querySelector(s);
  const wrap=$("#card"),front=$("#frontFace"),reading=$("#reading"),drawBtn=$("#drawBtn"),revToggle=$("#revToggle");
  const RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const rnd=n=>{try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}catch(e){return Math.floor(Math.random()*n)}};

  $("#backFace").innerHTML=BACK;
  try{if(localStorage.getItem("arcana.rev")==="0")revToggle.checked=false}catch(e){}
  revToggle.addEventListener("change",()=>{try{localStorage.setItem("arcana.rev",revToggle.checked?"1":"0")}catch(e){}});

  let busy=false,shown=false,drawId=0;
  async function draw(){
    if(busy)return;
    busy=true;drawBtn.disabled=true;const myId=++drawId;
    if(shown){reading.classList.add("is-hidden");wrap.classList.remove("is-open");await sleep(RM?50:850)}
    wrap.classList.add("shuffling");await sleep(RM?50:1000);wrap.classList.remove("shuffling");
    const i=rnd(22),rev=revToggle.checked&&rnd(2)===1;
    front.innerHTML=cardSVG(i);
    wrap.classList.toggle("is-rev",rev);
    wrap.classList.add("is-open");shown=true;
    await sleep(RM?50:850);
    reading.innerHTML=readingHTML(CARDS[i],rev);
    reading.classList.remove("is-hidden");
    drawBtn.textContent="もう一度引く";drawBtn.disabled=false;busy=false;
    setTimeout(()=>{
      if(myId===drawId&&reading.getBoundingClientRect().top>window.innerHeight*.6){reading.scrollIntoView({behavior:RM?"auto":"smooth",block:"start"})}
    },RM?0:1600);
  }
  drawBtn.addEventListener("click",draw);
  wrap.addEventListener("click",draw);

  /* tabs */
  const tabDraw=$("#tabDraw"),tabIndex=$("#tabIndex"),viewDraw=$("#viewDraw"),viewIndex=$("#viewIndex");
  function show(which){
    const d=which==="draw";
    viewDraw.hidden=!d;viewIndex.hidden=d;
    tabDraw.setAttribute("aria-pressed",String(d));tabIndex.setAttribute("aria-pressed",String(!d));
  }
  tabDraw.addEventListener("click",()=>show("draw"));
  tabIndex.addEventListener("click",()=>show("index"));

  /* index grid */
  const grid=$("#grid");
  grid.innerHTML=CARDS.map(c=>`<li><button type="button" class="tile" data-i="${c.i}" aria-label="${c.jp}の意味を見る"><span class="mini">${cardSVG(c.i)}</span><span class="t-kw">${c.ku.slice(0,2).join(" ・ ")}</span></button></li>`).join("");

  /* detail sheet */
  const sheet=$("#sheet"),sheetClose=$("#sheetClose");
  let lastTile=null;
  function openSheet(i,tile){
    lastTile=tile;
    $("#sheetCard").innerHTML=cardSVG(i);
    $("#sheetText").innerHTML=detailHTML(CARDS[i]);
    sheet.hidden=false;document.documentElement.style.overflow="hidden";
    sheetClose.focus();
  }
  function closeSheet(){
    sheet.hidden=true;document.documentElement.style.overflow="";
    if(lastTile)lastTile.focus();
  }
  grid.addEventListener("click",e=>{const t=e.target.closest(".tile");if(t)openSheet(+t.dataset.i,t)});
  sheetClose.addEventListener("click",closeSheet);
  sheet.addEventListener("click",e=>{if(e.target===sheet)closeSheet()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!sheet.hidden)closeSheet()});
})();
</script>
</body>
</html>
